<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de desarrollador</title>
</head>
<body>
    <form action="">
        <h1>Formulario de registro de desarrollador</h1>

        <fieldset>
            <legend>Datos personales</legend>

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" minlength="2" maxlength="50" required>

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Apellido" minlength="2" maxlength="50" required>

            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" placeholder="Edad" min="18" max="100">

             <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="Correo" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña" minlength="8" maxlength="30" required>

            <label for="fecNacimiento">Fecha Nacimiento</label>
            <input type="date" id="fecNacimiento" name="fecNacimiento"> 

            <label for="pais">Pais</label>
            <select name="pais" id="pais" required>
                <option value="">Seleccione un pais</option>

                <option value="ve">Venezuela</option>

                <option value="ar">Argentina</option>

            </select>
            
        </fieldset>

        <fieldset>
            <legend>Perfil Profesional</legend>
            
            <input type="radio" id="junior" name="perfil" value="junior">
            <label for="junior">Junior</label>
            
            <input type="radio" id="semiSenior" name="perfil" value="semiSenior">
            <label for="semiSenior">Semi Senior</label>

            <input type="radio" id="senior" name="perfil" value="senior">
            <label for="senior">Senior</label>          
        </fieldset>

        <fieldset>
            <legend>Tecnología principal</legend>

            <input type="radio" id="csharp" name="tecnologia" value="c#">
            <label for="csharp">C#</label>

            <input type="radio" id="java" name="tecnologia" value="java">
            <label for="java">Java</label>

            <input type="radio" id="javascript" name="tecnologia" value="javascript">
            <label for="javascript">JavaScript</label>

            <input type="radio" id="python" name="tecnologia" value="python">
            <label for="python">Python</label>

            <input type="radio" id="otro" name="tecnologia" value="otro">
            <label for="otro">Otro</label> 
        </fieldset>
        
        <fieldset>
            <legend>Modalidad preferida</legend>

            <input type="radio" id="presencial" name="modalidad" value="presencial">
            <label for="presencial">Presencial</label>

            <input type="radio" id="remoto" name="modalidad" value="remoto">
            <label for="remoto">Remoto</label>

            <input type="radio" id="hibrido" name="modalidad" value="hibrido">
            <label for="hibrido">Híbrido</label>
        </fieldset>

       
        <fieldset>
            <legend>Descripción Profesional</legend>

            <textarea name="descripcion" id="descripcion" placeholder="Escriba una descripción profesional" rows="5"></textarea>
        </fieldset>


        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label>

        <button type="submit">Guardar</button>
        <button type="reset">Limpiar</button>
    </form>
</body>
</html>
